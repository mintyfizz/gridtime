[project]
name = "gridtime"
version = "0.1.0"
description = "Bitemporal lakehouse for Belgian grid data (Elia Open Data)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyiceberg[s3fs,sql-sqlite,pyarrow,pyiceberg-core]>=0.9",
    "duckdb>=1.0",
    "polars>=1.0",
    "streamlit>=1.40",
    "altair>=5.4",
    "pandas>=2.2",
    "dagster>=1.11",
    "dagster-webserver>=1.11",
    "dagster-dbt>=0.27",
    "dbt-core>=1.10",
    "confluent-kafka>=2.5",
    "scikit-learn>=1.5",
    "mlflow>=2.16",
    "joblib>=1.4",
    "tabulate>=0.9",
    "dbt-trino>=1.9",
    "soda-core-trino>=3.5,<4",
    "setuptools>=84.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridtime"]

[tool.dagster]
module_name = "gridtime.orchestration.definitions"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
