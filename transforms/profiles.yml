gridtime:
  target: local
  outputs:
    local:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'localhost') }}"
      port: "{{ env_var('TRINO_PORT', '8085') | int }}"
      user: "{{ env_var('TRINO_USER', 'gridtime') }}"
      catalog: lakehouse
      schema: gold
      http_scheme: http
      threads: 2
