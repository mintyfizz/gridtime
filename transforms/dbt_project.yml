name: gridtime
version: "0.6.0"
config-version: 2
profile: gridtime

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Canonical measures pivoted into columns of fct_balancing_minute.
  wide_measures:
    - system_imbalance
    - ace
    - price_up_marginal
    - price_down_marginal
    - price_floor
    - price_cap
    - price_r2_up
    - price_r2_down
    - price_mfrr_up
    - price_mfrr_down
    - price_intertso_export
    - price_intertso_import

models:
  gridtime:
    staging:
      +on_table_exists: replace
      +materialized: table
      +schema: staging
    marts:
      +materialized: table
      +properties:
        format: "'PARQUET'"
      +on_table_exists: replace
